<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aparfolio — Aparnaa's Portfolio</title>
    <link rel="icon" href ="./images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="./images/favicon-96x96.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="upper-right-control">
        <button id="upperActionButton" 
        class="button upper-right-button" 
        aria-label="Instructions" 
        title="Instructions"></button>
        <span class="top-label">Instructions</span>
    </div>
    <!-- Title card shown on first load, removed after fade -->
    <div id="titleCard" class="title-card" role="dialog" aria-hidden="false">
        <div class="title-card-content">
            <img src="./images/favicon-96x96.png" alt="Aparfolio Logo" class="title-card-logo" width="100" height="100">
            <h1>Welcome to Aparfolio!</h1>
            <p class="subtitle">This is a portfolio website by me in the form of an music production launchpad that combines everything I've learned and accomplished over the years. - Aparnaa Senthilnathan</p>
        </div>
    </div>
    <main>
        <div class="container-frame">
            <div class="container">

                <!-- ============ -->
                <!-- Top Controls -->
                <!-- ============ -->
                <div class="top-controls-wrap">
                    <div class="top-controls">
                        <div class="top-control-item">
                            <a
                                href="./resume.pdf"
                                download="Aparnaa_Senthilnathan_Resume.pdf"
                                class="button"
                                aria-label="Download Resume"
                                title="Download Resume"
                            ></a>
                            <span class="top-label">Resume</span>
                        </div>
                        <div class="top-control-item">
                            <a
                                href="https://github.com/AparCode"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="button"
                                aria-label="GitHub"
                            ></a>
                            <span class="top-label">GitHub</span>
                        </div>
                        <div class="top-control-item">
                            <a
                                href="https://www.linkedin.com/in/aparnaain/"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="button"
                                aria-label="LinkedIn"
                            ></a>
                            <span class="top-label">LinkedIn</span>
                        </div>
                        <div class="top-control-item">
                            <a
                                href="https://mail.google.com/mail/?view=cm&fs=1&to=apar2003@gmail.com"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="button"
                                aria-label="Contact"
                            ></a>
                            <span class="top-label">Contact</span>
                        </div>
                    </div>
                </div>
                <!-- ============= -->
                <!-- Clear Control -->
                <!-- ============= -->
                <div class="clear-control">
                    <div class="top-control-item">
                        <button class="button" aria-label="Clear"></button>
                        <span class="top-label">Clear</span>
                    </div>
                </div>
                <!-- ============= -->
                <!-- Side Controls -->
                <!-- ============= -->
                <div class="side-controls">
                    <div class="side-control-row">
                        <button class="button" aria-label="About"></button>
                        <span class="side-label">About</span>
                    </div>
                    <div class="side-control-row">
                        <button class="button" aria-label="Experience"></button>
                        <span class="side-label">Experience</span>
                    </div>
                    <div class="side-control-row arrows-row">
                        <div class="side-control-arrows">
                            <button class="pads-scroll-btn up button" aria-label="Scroll Up" title="Scroll Up">▲</button>
                            <button class="pads-scroll-btn down button" aria-label="Scroll Down" title="Scroll Down">▼</button>
                        </div>
                        <span class="side-label"></span>
                    </div>
                    <div class="side-control-row">
                        <button class="button" aria-label="Projects"></button>
                        <span class="side-label">Projects</span>
                    </div>
                    <div class="side-control-row">
                        <button class="button" aria-label="Music"></button>
                        <span class="side-label">Music</span>
                    </div>
                </div>
                <!-- ============ -->
                <!-- LED Pad Grid (with scroll controls) -->
                <!-- ============ -->
                <div class="pads-area">
                    <div class="pads-scroll-wrapper">
                        <div class="led-pads">
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                            <div class="pad"></div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </main>
    <!-- ========== -->
    <!-- Pad Dialog  -->
    <!-- ========== -->
    <dialog id="padDialog" aria-labelledby="padDialogTitle">
        <h2 id="padDialogTitle">Pad</h2>
        <div id="padDialogMedia" class="pad-dialog-media">
            <img id="padDialogImage" src="" alt="Pad Image" hidden sizes="(max-width:800px) 60px, 120px">
            <video id="padDialogVideo" controls playsinline preload="metadata" hidden></video>
            <iframe id="padDialogEmbed" src="" hidden frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div id="padDialogMediaControls" class="pad-dialog-media-controls" hidden>
            <button id="padDialogPrevMedia" type="button">← Prev</button>
            <span id="padDialogMediaCounter">1 / 1</span>
            <button id="padDialogNextMedia" type="button">Next →</button>
        </div>
        <p id="padDialogMessage"></p>
        <p id="padDialogSkills"></p>
        <div class="dialog-actions">
            <button id="padDialogClose" type="button">Close</button>
            <button id="padDialogProject" type="button">Project Link</button>
            <button id="padDialogRepo" type="button">View Repo</button>
        </div>
    </dialog>
    <!-- ======= -->
    <!-- Scripts -->
    <!-- ======= -->
    <script src="./app.js" defer></script>
</body>
</html>
